<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Thảo ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Thẻ nội dung chính */
        .card {
            background: rgba(255, 255, 255, 0.92);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 85%;
            width: 350px;
            z-index: 10;
            backdrop-filter: blur(5px);
            animation: fadeIn 1.2s ease-in-out;
        }

        h1 {
            color: #e91e63;
            margin-bottom: 15px;
            font-size: 24px;
        }

        p {
            color: #333;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 25px;
            font-weight: 500;
        }

        /* Nút bấm tương tác */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            background-color: #ff4081;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 10px rgba(255, 64, 129, 0.3);
        }

        button:hover {
            background-color: #f50057;
            transform: scale(1.08);
        }

        /* Hiệu ứng trái tim và hộp quà bay */
        .floating-item {
            position: absolute;
            bottom: -50px;
            font-size: 24px;
            user-select: none;
            pointer-events: none;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-105vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>✨ Chúc Mừng Sinh Nhật Thảo! ✨</h1>
        
        <p>Thảo trả phí cho tớ bằng 1 nụ hôn nhé hihi 😘</p>
        
        <div class="btn-group">
            <button onclick="respond(1)">1 cái 💋</button>
            <button onclick="respond(10)">10 cái 😘</button>
        </div>
    </div>

    <script>
        // Tạo hiệu ứng trái tim và hộp quà bay
        const icons = ['❤️', '💖', '🎁', '✨', '🌸', '💕', '💋'];
        function createFloatingItem() {
            const item = document.createElement('div');
            item.classList.add('floating-item');
            item.innerText = icons[Math.floor(Math.random() * icons.length)];
            item.style.left = Math.random() * 100 + 'vw';
            item.style.animationDuration = (Math.random() * 3 + 3) + 's';
            item.style.fontSize = (Math.random() * 15 + 20) + 'px';
            document.body.appendChild(item);

            setTimeout(() => {
                item.remove();
            }, 6000);
        }

        setInterval(createFloatingItem, 300);

        // Phản hồi khi Thảo bấm chọn nút
        function respond(amount) {
            if (amount === 1) {
                alert('Chốt deal 1 nụ hôn nhé! Nhớ trả đủ đấy nha 😚❤️');
            } else {
                alert('Wow 10 cái luôn! Thảo hứa rồi đấy nhé, tớ ghi nhớ rồi đó nha 🥰💋');
            }
        }
    </script>
</body>
</html>
