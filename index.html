<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Sinh Nhật!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Thẻ nội dung chính */
        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 80%;
            z-index: 10;
            backdrop-filter: blur(5px);
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            color: #e91e63;
            margin-bottom: 15px;
            font-size: 24px;
        }

        p {
            color: #333;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Nút bấm tương tác */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            background-color: #ff4081;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 10px rgba(255, 64, 129, 0.3);
        }

        button:hover {
            background-color: #f50057;
            transform: scale(1.05);
        }

        /* Hiệu ứng bong bóng / Trái tim / Hộp quà bay */
        .floating-item {
            position: absolute;
            bottom: -50px;
            font-size: 24px;
            user-select: none;
            pointer-events: none;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-105vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>✨ Happy Birthday! ✨</h1>
        <!-- THAY ĐỔI LỜI NHẮN CỦA BẠN TẠI ĐÂY -->
        <p>
            Chúc mừng sinh nhật cô gái đặc biệt! 🎂<br>
            Chúc em tuổi mới luôn tràn ngập nụ cười, hạnh phúc và gặp thật nhiều may mắn.<br>
            Cảm ơn em vì đã xuất hiện! ❤️
        </p>
        
        <p><strong>Em có thích món quà nhỏ này không?</strong></p>
        <div class="btn-group">
            <button onclick="respond('Thích lắm luôn! 🥰')">Có, thích lắm! ❤️</button>
            <button onclick="respond('Siêu thích luôn nè! ✨')">Rất thích luôn! 🥰</button>
        </div>
    </div>

    <script>
        // Tạo hiệu ứng trái tim và hộp quà bay
        const icons = ['❤️', '💖', '🎁', '✨', '🌸', '💕'];
        function createFloatingItem() {
            const item = document.createElement('div');
            item.classList.add('floating-item');
            item.innerText = icons[Math.floor(Math.random() * icons.length)];
            item.style.left = Math.random() * 100 + 'vw';
            item.style.animationDuration = (Math.random() * 3 + 3) + 's'; // Bay trong 3-6s
            item.style.fontSize = (Math.random() * 15 + 20) + 'px';
            document.body.appendChild(item);

            setTimeout(() => {
                item.remove();
            }, 6000);
        }

        setInterval(createFloatingItem, 300);

        // Phản hồi khi bấm nút
        function respond(message) {
            alert('Cảm ơn em: ' + message + '\nChúc em một ngày sinh nhật thật tuyệt vời! 🎉');
        }
    </script>
</body>
</html>
